<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light d-flex align-items-center justify-content-center min-vh-100">
   
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card bagian-gelap text-light border-secondary shadow p-2">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 fw-bold">
                            <span class="text-merah">Log</span>in Admin
                        </h2>

                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label text-secondary small">Username</label>
                                <input type="text"  name="username" class="form-control bg-dark text-light border-secondary"  placeholder="Masukkan username" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label text-secondary small">Password</label>
                                <input type="password"name="password"  class="form-control bg-dark text-light border-secondary" placeholder="Masukkan password"  required>
                                <div class="form-text text-secondary" style="font-size: 12px;">
                                    Masukan Password anda
                                </div>
                            </div>

                            <button type="submit" class="tombol w-100 mt-3 py-2 fw-semibold text-white">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
