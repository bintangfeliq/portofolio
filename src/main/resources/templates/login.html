<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-5 col-lg-4">
                
                <div class="card bagian-gelap text-light border border-secondary shadow rounded-4 p-4">
                    <div class="card-body p-sm-2">
                        
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-light mb-1">
                                Portfolio<span class="text-merah">.</span>
                            </h2>
                            <p class="text-secondary small mb-0">
                                Login dan kelola Potofolio
                            </p>
                        </div>

                        <div th:if="${pesanError != null}" class="alert alert-danger py-2 px-3 small mb-3 border-0 bg-danger bg-opacity-10 text-danger rounded-3 text-center" th:text="${pesanError}">
                            Username atau password salah!
                        </div>

                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label text-secondary small mb-1">Username</label>
                                <input type="text" id="username" name="username" 
                                       class="form-control bg-dark text-light border-secondary py-2 rounded-3" 
                                       placeholder="Masukkan username" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label text-secondary small mb-1">Password</label>
                                <input type="password" id="password" name="password" 
                                       class="form-control bg-dark text-light border-secondary py-2 rounded-3" 
                                       placeholder="Masukkan password" required>
                            </div>

                            <button type="submit" class="btn btn-danger w-100 py-2 fw-medium rounded-3">
                                Masuk ke Dashboard
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
