<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Access - Admin Clearance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="comic-login-body">

    <div class="comic-login-halftone" aria-hidden="true"></div>
    <div class="comic-login-ambient" aria-hidden="true"></div>

    <div class="comic-login-container">
        <div class="comic-login-card">
            <div class="comic-login-inner">

                <div class="comic-login-header">
                    <h1 class="comic-login-title">
                        Masuk <span class="comic-title-highlight">Dashboard</span>
                    </h1>
                    <p class="comic-login-subtitle">
                        Autentikasi keamanan untuk mengelola konten portfolio.
                    </p>
                </div>

                <div th:if="${pesanError != null}" class="comic-login-alert" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${pesanError}">Username atau password salah</span>
                </div>

                <form th:action="@{/login}" method="POST">
                    <div class="comic-form-group">
                        <label for="username" class="comic-form-label">
                            <i class="bi bi-person-badge-fill"></i>
                            <span>Username</span>
                        </label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="comic-form-input"
                               placeholder="Masukkan username"
                               autocomplete="username"
                               required autofocus>
                    </div>

                    <div class="comic-form-group">
                        <label for="password" class="comic-form-label">
                            <i class="bi bi-key-fill"></i>
                            <span>Password</span>
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="comic-form-input"
                               placeholder="••••••••"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit" class="comic-submit-btn">
                        <span>Verifikasi &amp; Masuk</span>
                        <i class="bi bi-arrow-right-short" style="font-size: 1.3rem;"></i>
                    </button>
                </form>

                <div class="comic-login-footer">
                    <a th:href="@{/}" class="comic-back-link">
                        <i class="bi bi-arrow-left"></i>
                        <span>Kembali ke Beranda</span>
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
