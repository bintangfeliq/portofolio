<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Project - ' + ${profil != null ? profil.nama : 'Portfolio'}">Project - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .project-card {
            cursor: pointer;
            transition: 0.25s ease;
            background: #141414;
            border: 1px solid #282828;
        }
        .project-card:hover {
            transform: translateY(-5px);
            border-color: #fa1226 !important;
            box-shadow: 0 10px 25px rgba(250, 18, 38, 0.15) !important;
        }
        .modal-content {
            background-color: #141414;
            border: 1px solid #333;
            color: #fff;
            border-radius: 16px;
        }
        .modal-header, .modal-footer {
            border-color: #282828;
        }
        .modal-img {
            max-height: 400px;
            object-fit: contain;
            background-color: #0b0b0b;
            border-radius: 10px;
        }
        .carousel-control-prev, .carousel-control-next {
            width: 40px;
            height: 40px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(250, 18, 38, 0.85);
            border-radius: 50%;
            margin: 0 10px;
        }
    </style>
</head>

<body class="bg-hitam text-light d-flex flex-column min-vh-100">

    <header class="border-bottom border-secondary sticky-top bg-hitam">
        <div class="container">
            <nav class="navbar navbar-expand py-3">
                <a th:href="@{/}" class="navbar-brand fw-bold text-light fs-4">
                    Portfolio<span class="text-merah">.</span>
                </a>

                <div class="ms-auto d-flex align-items-center">
                    <a th:href="@{/}" class="nav-link text-light mx-2 px-1">
                        Beranda
                    </a>
                    <a th:href="@{/tentang}" class="nav-link text-light mx-2 px-1">
                        Tentang
                    </a>
                    <a th:href="@{/tentang#skill}" class="nav-link text-light mx-2 px-1">
                        Skill
                    </a>
                    <a th:href="@{/project}" class="nav-link text-danger fw-bold mx-2 px-1">
                        Project
                    </a>
                    <a th:href="@{/tentang#kontak}" class="nav-link text-light mx-2 px-1">
                        Kontak
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="flex-grow-1 py-5">
        <div class="container py-4">
            
            <div class="mb-5 text-center text-md-start">
                <p class="teks-merah fw-bold text-uppercase small mb-2" style="letter-spacing: 1.5px;">
                    PORTFOLIO KARYA
                </p>
                <h1 class="fw-bold display-6">
                    <span class="text-merah">Project</span> Saya.
                </h1>
            </div>

            <div class="row g-4">
                <div th:each="p : ${projects}" class="col-md-6 col-lg-4">
                    
                    <div class="card project-card text-light h-100 rounded-4 overflow-hidden shadow-sm d-flex flex-column p-4"
                         data-bs-toggle="modal" 
                         th:data-bs-target="'#modalProject-' + ${p.id}">
                        
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span th:if="${p.teknologi != null and !#strings.isEmpty(p.teknologi)}" 
                                  class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50 px-2 py-1 small rounded-2"
                                  th:text="${p.teknologi}">
                                Teknologi
                            </span>
                            
                            <span class="badge bg-dark border border-secondary text-secondary small px-2 py-1 rounded-2">
                                <i class="bi bi-images text-merah me-1"></i>
                                <span th:text="${p.gambar != null ? #lists.size(p.gambar) : 0}">0</span> Foto
                            </span>
                        </div>

                        <h4 class="fw-bold text-light mb-2" th:text="${p.namaProject}">
                            Nama Project
                        </h4>

                        <p class="text-secondary small lh-base mb-4 flex-grow-1" th:text="${p.deskripsi}">
                            Deskripsi project.
                        </p>

                        <div class="pt-3 border-top border-secondary border-opacity-50 d-flex justify-content-between align-items-center mt-auto">
                            <span class="text-merah small fw-semibold">
                                <i class="bi bi-eye me-1"></i> Lihat Foto
                            </span>
                            <i class="bi bi-arrow-up-right text-merah"></i>
                        </div>
                    </div>



                    <div class="modal fade" th:id="'modalProject-' + ${p.id}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-centered">
                            <div class="modal-content shadow-lg">
                                
                                <div class="modal-header px-4 py-3">
                                    <div>
                                        <h5 class="modal-title fw-bold text-light mb-1" th:text="${p.namaProject}">Nama Project</h5>
                                        <span class="badge bg-danger bg-opacity-25 text-danger border border-danger border-opacity-50 px-2 py-1 small rounded-2"
                                              th:text="${p.teknologi}">
                                            Teknologi
                                        </span>
                                    </div>
                                </div>

                                <div class="modal-body p-4">
                                    
                                    <div th:if="${p.gambar != null and !#lists.isEmpty(p.gambar)}">
                                        <div th:id="'carouselProject-' + ${p.id}" class="carousel slide" data-bs-ride="false">
                                            <div class="carousel-inner rounded-3">
                                                <div th:each="g, gStat : ${p.gambar}" 
                                                     th:class="${gStat.first} ? 'carousel-item active text-center' : 'carousel-item text-center'">
                                                    <img th:src="@{'/images/' + ${g.gambar}}" 
                                                         class="d-block w-100 modal-img" 
                                                         th:alt="${p.namaProject}">
                                                </div>
                                            </div>

                                            <button th:if="${#lists.size(p.gambar) > 1}" 
                                                    class="carousel-control-prev" 
                                                    type="button" 
                                                    th:data-bs-target="'#carouselProject-' + ${p.id}" 
                                                    data-bs-slide="prev">
                                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                            </button>
                                            <button th:if="${#lists.size(p.gambar) > 1}" 
                                                    class="carousel-control-next" 
                                                    type="button" 
                                                    th:data-bs-target="'#carouselProject-' + ${p.id}" 
                                                    data-bs-slide="next">
                                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                            </button>
                                        </div>
                                    </div>

                                    <div th:if="${p.gambar == null or #lists.isEmpty(p.gambar)}" class="text-center py-5 text-secondary border border-secondary border-opacity-25 rounded-3 bg-black">
                                        <i class="bi bi-image fs-1 d-block mb-2 text-secondary"></i>
                                        <p class="mb-0 small">Belum ada foto untuk project ini.</p>
                                    </div>

                                    <div class="mt-4 p-3 bg-dark rounded-3 border border-secondary border-opacity-25">
                                        <h6 class="fw-bold text-light mb-1">Deskripsi Project:</h6>
                                        <p class="text-secondary small mb-0 lh-base" style="white-space: pre-line;" th:text="${p.deskripsi}">
                                            Deskripsi project.
                                        </p>
                                    </div>

                                </div>

                                <div class="modal-footer px-4 py-3">
                                    <button type="button" class="btn btn-outline-danger btn-sm px-4" data-bs-dismiss="modal">Tutup</button>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </main>

    <footer class="border-top border-secondary py-4 mt-auto">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-secondary small" th:text="${profil != null ? profil.nama : 'Portfolio'}">Portfolio</span>
                <span class="text-secondary small">Portfolio<span class="text-merah">.</span></span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
