<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light min-vh-100 py-5">

    <div class="container" style="max-width: 750px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1">Edit <span class="text-merah">Project</span></h2>
                <p class="text-secondary small mb-0">Perbarui data dan kelola project</p>
            </div>
            <div>
                <a th:href="@{/dashboard/dashboardProject}" class="btn btn-outline-danger btn-sm">Kembali</a>
            </div>
        </div>

        <div class="card bagian-gelap text-light border-secondary shadow p-3 rounded-4 mb-4">
            <div class="card-body p-4">
                <form th:action="@{'/dashboard/dashboardProject/editProject/' + ${project.id}}" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label class="form-label text-secondary small">Nama Project</label>
                        <input type="text" name="namaProject" th:value="${project.namaProject}" class="form-control bg-dark text-light border-secondary" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small">Teknologi yang Digunakan</label>
                        <input type="text" name="teknologi" th:value="${project.teknologi}" class="form-control bg-dark text-light border-secondary"  required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small">Deskripsi Project</label>
                        <textarea name="deskripsi" th:text="${project.deskripsi}" rows="4" class="form-control bg-dark text-light border-secondary"  required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small">Tambah Foto </label>
                        <input type="file" name="files"  class="form-control bg-dark text-light border-secondary">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="tombol flex-grow-1 py-2 fw-semibold text-white">
                            <i class="bi bi-check-circle me-1"></i> Simpan Perubahan
                        </button>
                        <a th:href="@{/dashboard/dashboardProject}" class="btn btn-secondary px-4 py-2 rounded-3 d-flex align-items-center">
                            Batal
                        </a>
                    </div>

                </form>
            </div>
        </div>


        <div class="card bagian-gelap text-light border-secondary shadow p-3 rounded-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-images text-merah"></i> Foto Project Saat Ini
                </h5>

                <div th:if="${project.gambar != null and !#lists.isEmpty(project.gambar)}" class="row g-3">
                    <div th:each="g : ${project.gambar}" class="col-6 col-sm-4 col-md-3">
                        <div class="position-relative border border-secondary rounded-3 overflow-hidden bg-black text-center" style="height: 120px;">
                            <img th:src="@{'/images/' + ${g.gambar}}" alt="Foto Project" class="w-100 h-100" style="object-fit: cover;">
                            <a th:href="@{'/dashboard/dashboardProject/hapusGambar/' + ${g.id}(projectId=${project.id})}" 
                               class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1 py-0 px-1 rounded-circle"
                               onclick="return confirm('Hapus foto ini dari project?');" title="Hapus Foto">
                                <i class="bi bi-x" style="font-size: 14px;"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
