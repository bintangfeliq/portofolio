<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Keahlian - Dashboard Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="comic-dash-body">

    <div class="comic-dash-wrapper">
        
        <aside class="comic-dash-sidebar">
            <div class="comic-dash-brand">
                <a th:href="@{/dashboard}" class="comic-brand-title">
                    Portfolio<span>.</span>
                </a>
            </div>

            <nav class="comic-dash-nav">
                <span class="comic-nav-section-title">Menu Utama</span>
                <a th:href="@{/dashboard}" class="comic-nav-item">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/dashboard/editTentang}" class="comic-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Tentang Saya</span>
                </a>
                <a th:href="@{/dashboard/dashboardPendidikan}" class="comic-nav-item">
                    <i class="bi bi-mortarboard"></i>
                    <span>Pendidikan</span>
                </a>
                <a th:href="@{/dashboard/dashboardKeahlian}" class="comic-nav-item active">
                    <i class="bi bi-code-slash"></i>
                    <span>Skill</span>
                </a>
                <a th:href="@{/dashboard/dashboardProject}" class="comic-nav-item">
                    <i class="bi bi-layers"></i>
                    <span>Project</span>
                </a>
                <a th:href="@{/dashboard/editKontak}" class="comic-nav-item">
                    <i class="bi bi-envelope"></i>
                    <span>Kontak</span>
                </a>
            </nav>

            <div class="comic-dash-sidebar-footer">
                <a th:href="@{/}" class="comic-logout-btn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Keluar</span>
                </a>
            </div>
        </aside>

        <main class="comic-dash-main">
            
            <div class="comic-dash-header">
                <div>
                    <h1 class="comic-dash-header-title">
                        Ubah <span>Data Keahlian</span>
                    </h1>
                    <p class="comic-dash-header-desc">
                        Perbarui nama atau keterangan status keahlian.
                    </p>
                </div>
                <div>
                    <a th:href="@{/dashboard/dashboardKeahlian}" class="comic-header-btn">
                        <i class="bi bi-arrow-left"></i>
                        <span>Kembali ke Skill</span>
                    </a>
                </div>
            </div>

            <div style="max-width: 600px;">
                <div class="comic-panel">
                    <div class="comic-panel-header">
                        <h2 class="comic-panel-title">
                            <i class="bi bi-pencil-square"></i>
                            <span>Form Update Keahlian</span>
                        </h2>
                    </div>
                    <div class="comic-panel-body">
                        <form th:action="@{/dashboard/dashboardKeahlian/editKeahlian/{id}(id=${keahlian.id})}" th:object="${keahlian}" method="POST">
                            
                            <div class="comic-form-group">
                                <label for="nama" class="comic-form-label">Nama Skill</label>
                                <input type="text"
                                       id="nama"
                                       name="nama"
                                       th:field="*{nama}"
                                       class="comic-form-control"
                                       required>
                            </div>

                            <div class="comic-form-group">
                                <label for="deskripsi" class="comic-form-label">Keterangan / Deskripsi</label>
                                <input type="text"
                                       id="deskripsi"
                                       name="deskripsi"
                                       th:field="*{deskripsi}"
                                       class="comic-form-control">
                                <p style="font-size: 0.76rem; color: var(--text-muted); margin: 0.35rem 0 0 0;">
                                    Gunakan kata <em>"Masih dipelajari"</em> jika skill dalam tahap pembelajaran.
                                </p>
                            </div>

                            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                                <button type="submit" class="comic-submit-btn" style="flex: 1;">
                                    <i class="bi bi-check-circle"></i>
                                    <span>Simpan Perubahan</span>
                                </button>
                                <a th:href="@{/dashboard/dashboardKeahlian}" class="comic-header-btn" style="padding: 0.75rem 1.25rem;">
                                    <span>Batal</span>
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </main>

    </div>

</body>
</html>
