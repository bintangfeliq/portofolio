<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Keahlian - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light min-vh-100 py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1">Kelola Data <span class="text-merah">Keahlian</span></h2>
                <p class="text-secondary small mb-0">Ubah & kelola data keahlian portfolio</p>
            </div>
            <div>
                <a th:href="@{/dashboard/dashboardKeahlian}" class="btn btn-outline-danger btn-sm me-2">
                    <i class="bi bi-arrow-left me-1"></i> Kembali
                </a>
            </div>
        </div>

        <div class="row justify-content-center">      
            <div class="col-11 col-sm-9 col-md-7 col-lg-5">
                <div class="card bagian-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="card-title fw-bold mb-4 d-flex align-items-center gap-2">
                            <i class="bi bi-pencil-square text-merah"></i> Update Data Keahlian
                        </h4>

                        <form th:action="@{/dashboard/dashboardKeahlian/editKeahlian/{id}(id=${keahlian.id})}" th:object="${keahlian}" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Nama Skill / Keahlian</label>
                                <input type="text" name="nama" class="form-control bg-dark text-light border-secondary" th:field="*{nama}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-secondary small">Keterangan / Deskripsi</label>
                                <input type="text" name="deskripsi" class="form-control bg-dark text-light border-secondary" th:field="*{deskripsi}">
                                <div class="form-text text-secondary" style="font-size: 11px;">
                                    Tips: Gunakan kata <em>"Masih dipelajari"</em> jika skill masih dalam tahap pembelajaran.
                                </div>
                            </div>

                            <button type="submit" class="tombol w-100 py-2 fw-semibold text-white">
                                <i class="bi bi-save me-1"></i> Update Keahlian
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
