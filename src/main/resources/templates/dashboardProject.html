<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light min-vh-100 py-5">
    
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1">Kelola <span class="text-merah">Project</span></h2>
                <p class="text-secondary small mb-0">kelola project</p>
            </div>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-outline-danger btn-sm me-2">Kembali</a>
            </div>
        </div>

        <div class="row g-4 align-items-start">      
            
            <div class="col-lg-5">
                <div class="card bagian-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="card-title fw-bold mb-4 d-flex align-items-center gap-2">
                            <i class="bi bi-plus-circle text-merah"></i> Tambah Project
                        </h4>

                        <form th:action="@{/dashboard/project/tambah}" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Nama Project</label>
                                <input type="text" name="namaProject" class="form-control bg-dark text-light border-secondary" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Teknologi yang Digunakan</label>
                                <input type="text" name="teknologi" class="form-control bg-dark text-light border-secondary" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Gambar</label>
                                <input type="file" name="files"  class="form-control bg-dark text-light border-secondary">
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-secondary small">Deskripsi Project</label>
                                <textarea name="deskripsi" rows="4" class="form-control bg-dark text-light border-secondary"  required></textarea>
                            </div>

                            <button type="submit" class="tombol w-100 py-2 fw-semibold text-white">
                                <i class="bi bi-save me-1"></i> Simpan Project
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card bagian-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="card-title fw-bold mb-0 d-flex align-items-center gap-2">
                                <i class="bi bi-folder-check text-merah"></i> Daftar Project
                            </h4>
                            <span class="text-secondary small" th:text="${#lists.size(projects)} + ' Project'">0 Project</span>
                        </div>

                        <div class="table-responsive flex-grow-1">
                            <table class="table table-dark table-hover align-middle mb-0" style="background: transparent;">
                                <thead>
                                    <tr class="text-secondary border-bottom border-secondary small">
                                        <th scope="col" style="background: transparent; width: 45px;">No</th>
                                        <th scope="col" style="background: transparent;">Nama Project</th>
                                        <th scope="col" style="background: transparent;">Teknologi</th>
                                        <th scope="col" style="background: transparent;">Foto</th>
                                        <th scope="col" style="background: transparent;" class="text-end">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p, pStat : ${projects}" class="border-bottom border-secondary border-opacity-25">
                                        <td style="background: transparent;" class="text-secondary small fw-medium" th:text="${pStat.count}">1</td>
                                        <td style="background: transparent;" class="fw-semibold text-light" th:text="${p.namaProject}">Aplikasi E-Commerce</td>
                                        <td style="background: transparent;">
                                            <span class="badge bg-secondary bg-opacity-25 text-light" th:text="${p.teknologi}">Spring Boot</span>
                                        </td>
                                        <td style="background: transparent;">
                                            <span class="badge bg-dark border border-secondary text-secondary small">
                                                <i class="bi bi-image text-merah me-1"></i>
                                                <span th:text="${p.gambar != null ? #lists.size(p.gambar) : 0}">0</span> Foto
                                            </span>
                                        </td>
                                        <td style="background: transparent;" class="text-end">
                                            <div class="d-inline-flex gap-2">
                                                <a th:href="@{'/dashboard/dashboardProject/editProject/' + ${p.id}}" class="btn btn-outline-secondary btn-sm py-1 px-2" title="Edit">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{'/dashboard/dashboardProject/hapusProject/' + ${p.id}}" 
                                                   class="btn btn-outline-danger btn-sm py-1 px-2" 
                                                   onclick="return confirm('Hapus project ini beserta seluruh fotonya?');" title="Hapus">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
