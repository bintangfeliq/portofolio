<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profil != null ? profil.nama + ' | Portfolio' : 'Portfolio'}">Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>

    <img th:src="@{/images/fix.jpg}" src="/images/fix.jpg" alt="" class="idx-bg" aria-hidden="true">

    <div class="idx-layout">

        <header class="folio-nav">
            <div class="folio-nav-container">
                <nav class="folio-nav-links">
                    <a th:href="@{/}" class="folio-link active"><i class="bi bi-house"></i> Beranda</a>
                    <a th:href="@{/tentang}" class="folio-link"><i class="bi bi-person"></i> Tentang</a>
                    <a th:href="@{/tentang#pendidikan}" class="folio-link"><i class="bi bi-mortarboard"></i> Pendidikan</a>
                    <a th:href="@{/tentang#skill}" class="folio-link"><i class="bi bi-code-slash"></i> Skill</a>
                    <a th:href="@{/tentang#project}" class="folio-link"><i class="bi bi-layers"></i> Project</a>
                    <a th:href="@{/tentang#kontak}" class="folio-link"><i class="bi bi-envelope"></i> Kontak</a>
                </nav>
            </div>
        </header>

        <main class="idx-hero">
            <div class="idx-hero-card">

                <img th:src="@{'/images/' + ${profil.foto}}"
                     alt="Foto Profil"
                     class="idx-foto">

                <div class="idx-text">

                    <span class="idx-role">
                        <i class="bi bi-person-badge me-1"></i>Student &amp; Junior Web Developer
                    </span>

                    <h1 class="idx-nama" th:text="${profil.nama}">Nama</h1>

                    <p class="idx-desc" th:text="${profil.deskripsi}">Deskripsi singkat.</p>

                    <div class="d-flex flex-wrap gap-3">
                        <a th:href="@{/tentang}" class="idx-btn-red">
                            <i class="bi bi-person-fill"></i> Profil Saya
                        </a>
                        <a th:href="@{/tentang#project}" class="idx-btn-ghost">
                            <i class="bi bi-layers-fill"></i> Lihat Project
                        </a>
                    </div>

                </div>

            </div>
        </main>

        <footer class="glass-bar idx-footer">
            <div class="idx-footer-inner">
                <span th:text="${profil != null ? profil.nama : 'Portfolio'}">Portfolio</span>
                <span>Portfolio<span class="idx-dot">.</span></span>
            </div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
