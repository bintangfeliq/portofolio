<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profil != null ? profil.nama + ' | Portfolio' : 'Portfolio'}">Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-hitam text-light d-flex flex-column min-vh-100">

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row align-items-center justify-content-center g-5">

                <div class="col-lg-4 col-md-5 text-center">
                    <img th:src="@{'/images/' + ${profil != null and profil.foto != null ? profil.foto : 'profil.jpg'}}" 
                         alt="Foto Profil" class="foto-profil img-fluid shadow">
                </div>

                <div class="col-lg-7 col-md-7 text-center text-md-start">
                    <p class="teks-merah fw-bold text-uppercase small mb-2" style="letter-spacing: 2px;">
                        HALO, SAYA
                    </p>

                    <h1 class="display-4 fw-bold mb-3 text-light"
                        th:text="${profil != null ? profil.nama : 'Bintang'}">
                        Nama Saya
                    </h1>

                    <p class="text-secondary fs-5 mb-4 pe-lg-4 lh-base"
                        th:text="${profil != null ? profil.deskripsi : 'Selamat datang di portfolio saya.'}">
                        Deskripsi
                    </p>

                    <div class="pt-2 d-flex flex-wrap justify-content-center justify-content-md-start gap-3">
                        <a th:href="@{/tentang}" class="btn btn-danger px-4 py-2 fw-medium rounded-3">
                            Tentang Saya
                        </a>
                        <a th:href="@{/tentang#skill}" class="btn btn-outline-light px-4 py-2 fw-medium rounded-3">
                            Lihat Project
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="border-top border-secondary py-4 mt-auto">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <span class="text-secondary small" th:text="${profil != null ? profil.nama : 'Portfolio'}">Portfolio</span>
                <span class="text-secondary small">Portfolio<span class="text-merah">.</span></span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
