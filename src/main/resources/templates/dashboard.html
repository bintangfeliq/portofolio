<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light">

    <div class="d-flex min-vh-100">
        
        <aside class="sidebar-sneat d-flex flex-column border-end border-secondary">  
            <div class="px-4 py-3 border-bottom border-secondary d-flex align-items-center justify-content-between">
                <a th:href="@{/dashboard}" class="text-decoration-none d-flex align-items-center gap-2">
                    <span class="fs-4 fw-bold text-light">Portfolio<span class="text-merah">.</span></span>
                </a>
            </div>

            <div class="flex-grow-1 py-3 px-3 overflow-y-auto">
                <div class="text-uppercase text-secondary small fw-bold px-3 mb-2" style="font-size: 11px; letter-spacing: 0.8px;">Menu Utama</div>

                <ul class="nav nav-pills flex-column gap-1 mb-4">
                    <li class="nav-item">
                        <a href="#" class="nav-link active bg-danger text-white d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-grid-fill fs-5"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-light d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-person-fill fs-5"></i>
                            <span>Profil</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-light d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-mortarboard-fill fs-5"></i>
                            <span>Pendidikan</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-light d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-code-slash fs-5"></i>
                            <span>Keahlian</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/dashboard/editKontak}" class="nav-link text-light d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-envelope-fill fs-5"></i>
                            <span>Kontak</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="p-3 border-top border-secondary mt-auto">
                <div class="d-flex align-items-center gap-2 px-2">
                        <a th:href="@{/login}" class="nav-link text-danger d-flex align-items-center gap-3 py-2 px-3 rounded-2">
                            <i class="bi bi-box-arrow-right fs-5"></i>
                            <span>Logout</span>
                        </a>
                </div>
            </div>

        </aside>

        <!-- Main Content Area -->
        <div class="flex-grow-1 d-flex flex-column">
            
            <!-- Topbar Header -->
            <header class="border-bottom border-secondary py-3 px-4 d-flex justify-content-between align-items-center bg-hitam">
                <h5 class="mb-0 fw-bold">Dashboard <span class="text-merah">Admin</span></h5>
                <div>
                    <a th:href="@{/login}" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </header>

            <!-- Main Workspace Body -->
            <main class="p-4 flex-grow-1">
                <!-- Konten halaman dashboard / form dikelola di sini -->
            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
