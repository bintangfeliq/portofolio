<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendidikan - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="latar-item text-light min-vh-100 py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1">Kelola Data <span class="tulisan-merah">Pendidikan</span></h2>
                <p class="text-secondary small mb-0">Ubah & kelola data riwayat pendidikan portfolio</p>
            </div>
            <div>
                <a th:href="@{/dashboard/dashboardPendidikan}" class="btn btn-outline-danger btn-sm me-2">Kembali</a>
            </div>
        </div>

        <div class="row justify-content-center">      
            <div class="col-11 col-sm-9 col-md-7 col-lg-5">
                <div class="card area-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="card-title fw-bold mb-4 d-flex align-items-center gap-2">
                            <i class="bi bi-pencil-square tulisan-merah"></i> Update Data Pendidikan
                        </h4>

                        <form th:action="@{/dashboard/dashboardPendidikan/editPendidikan/{id}(id=${pendidikan.id})}" th:object="${pendidikan}" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Nama Sekolah</label>
                                <input type="text" name="nama" class="form-control bg-dark text-light border-secondary" th:field="*{nama}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Tingkat Pendidikan</label>
                                <input type="text" name="tingkat" class="form-control bg-dark text-light border-secondary" th:field="*{tingkat}" required>
                            </div>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <label class="form-label text-secondary small">Tahun Mulai</label>
                                    <input type="number" name="tahunMulai" class="form-control bg-dark text-light border-secondary" th:field="*{tahunMulai}" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-secondary small">Tahun Selesai</label>
                                    <input type="number" name="tahunSelsai" class="form-control bg-dark text-light border-secondary" th:field="*{tahunSelsai}">
                                </div>
                                <div class="col-12">
                                    <div class="form-text text-secondary" style="font-size: 11px;">
                                        Kosongkan tahun selesai jika masih berlangsung.
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="tombol-pencet w-100 py-2 fw-semibold text-white">
                                <i class="bi bi-save me-1"></i> Update Pendidikan
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
