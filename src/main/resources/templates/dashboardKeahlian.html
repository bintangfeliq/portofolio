<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Keahlian - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-hitam text-light min-vh-100 py-5">
    
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
            <div>
                <h2 class="fw-bold mb-1">Kelola <span class="text-merah">Keahlian</span></h2>
                <p class="text-secondary small mb-0">Ubah & kelola data keahlian portfolio</p>
            </div>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-outline-danger btn-sm me-2">
                    <i class="bi bi-arrow-left me-1"></i> Kembali
                </a>
            </div>
        </div>

        <div class="row g-4 align-items-start">      
            
            <div class="col-lg-5">
                <div class="card bagian-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="card-title fw-bold mb-4 d-flex align-items-center gap-2">
                            <i class="bi bi-plus-circle text-merah"></i> Tambah Keahlian
                        </h4>

                        <form th:action="@{/dashboard/keahlian/tambah}" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Nama Skill / Keahlian</label>
                                <input type="text" name="nama" class="form-control bg-dark text-light border-secondary" placeholder="Contoh: Java, React, Python, UI/UX" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-secondary small">Keterangan / Deskripsi</label>
                                <input type="text" name="deskripsi" class="form-control bg-dark text-light border-secondary" placeholder="Contoh: Tingkat Mahir / Masih dipelajari">
                                <div class="form-text text-secondary" style="font-size: 11px;">
                                    Tips: Gunakan kata <em>"Masih dipelajari"</em> jika skill masih dalam tahap pembelajaran.
                                </div>
                            </div>

                            <button type="submit" class="tombol w-100 py-2 fw-semibold text-white">
                                <i class="bi bi-save me-1"></i> Simpan Keahlian
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card bagian-gelap text-light border-secondary shadow p-2 rounded-4">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="card-title fw-bold mb-0 d-flex align-items-center gap-2">
                                <i class="bi bi-code-slash text-merah"></i> Daftar Keahlian
                            </h4>
                            <span class="text-secondary small" th:text="${#lists.size(keahlian)} + ' Keahlian'">0 Keahlian</span>
                        </div>

                        <div class="table-responsive flex-grow-1">
                            <table class="table table-dark table-hover align-middle mb-0" style="background: transparent;">
                                <thead>
                                    <tr class="text-secondary border-bottom border-secondary small">
                                        <th scope="col" style="background: transparent; width: 45px;">No</th>
                                        <th scope="col" style="background: transparent;">Skill</th>
                                        <th scope="col" style="background: transparent;">Keterangan</th>
                                        <th scope="col" style="background: transparent;" class="text-end">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="k, kStat : ${keahlian}" class="border-bottom border-secondary border-opacity-25">
                                        <td style="background: transparent;" class="text-secondary small fw-medium" th:text="${kStat.count}">1</td>
                                        <td style="background: transparent;" class="fw-semibold text-light" th:text="${k.nama}">Skill</td>
                                        <td style="background: transparent;">
                                            <span th:if="${k.deskripsi != null and #strings.contains(#strings.toLowerCase(k.deskripsi), 'masih')}" class="badge-kuning" th:text="${k.deskripsi}">  Masih dipelajari </span>
                                            <span th:unless="${k.deskripsi != null and #strings.contains(#strings.toLowerCase(k.deskripsi), 'masih')}"  class="text-secondary small"  th:text="${k.deskripsi != null and !#strings.isEmpty(k.deskripsi) ? k.deskripsi : '-'}"> - </span>
                                        </td>
                                        <td style="background: transparent;" class="text-end">
                                            <div class="d-inline-flex gap-2">
                                                <a th:href="@{'/dashboard/dashboardKeahlian/editKeahlian/' + ${k.id}}" class="btn btn-outline-secondary btn-sm py-1 px-2">
                                                  <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{'/dashboard/dashboardKeahlian/hapusKeahlian/' + ${k.id}}" 
                                                   class="btn btn-outline-danger btn-sm py-1 px-2" 
                                                   onclick="return confirm('Hapus keahlian ini?');">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
